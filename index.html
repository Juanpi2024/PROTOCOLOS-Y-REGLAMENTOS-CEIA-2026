<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolos y Reglamentos 2026 - CEIA Juanita Zúñiga</title>
    <meta name="description" content="Portal oficial de protocolos y reglamentos del CEIA Juanita Zúñiga Fuentes de Parral.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">

    <!-- Styles -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <main class="hero">
        <div class="logo-container">
            <!-- Nota: Logo oficial del CEIA -->
            <img src="./assets/logo.jpg" alt="Logo CEIA Juanita Zúñiga" class="logo-img" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
            <div id="logo-fallback" style="display:none; font-size: 3rem; margin-bottom: 1rem;">🏛️</div>
            <span class="institution-name">CEIA Juanita Zúñiga Fuentes</span>
        </div>
        
        <h1>Protocolos y Reglamentos <span style="color: var(--secondary); background: var(--primary); padding: 0 10px; border-radius: 8px;">2026</span></h1>
        <p>Documentación oficial y procedimientos institucionales actualizados para toda la comunidad educativa de Parral.</p>
        
        <!-- Search and Filter Section -->
        <section class="controls-section">
            <div class="search-container">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" placeholder="Buscar reglamentos o protocolos..." aria-label="Buscar protocolos">
                <button id="search-clear" class="search-clear-btn" aria-label="Limpiar búsqueda" style="display: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="filter-tabs" id="filter-tabs">
                <button class="filter-tab active" data-category="all">
                    <span>📋 Todos</span>
                    <span class="filter-count" id="count-all">0</span>
                </button>
                <button class="filter-tab" data-category="documento">
                    <span>🏛️ Documentos</span>
                    <span class="filter-count" id="count-documento">0</span>
                </button>
                <button class="filter-tab" data-category="protocolo">
                    <span>🛡️ Protocolos</span>
                    <span class="filter-count" id="count-protocolo">0</span>
                </button>
            </div>
        </section>

        <section class="protocol-grid" id="protocol-container">
            <!-- Las tarjetas se generan dinámicamente desde main.js -->
        </section>

        <footer class="footer">
            <p class="signature">APP CREADA POR <span>JUAN P. RAMIREZ</span></p>
        </footer>
    </main>

    <!-- Global Modal System -->
    <div id="modal-overlay" aria-hidden="true" role="dialog">
        <div class="modal-window">
            <button id="modal-close" class="modal-close-btn" aria-label="Cerrar modal">
                <span>Cerrar</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            
            <!-- Dynamic Content Container -->
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./main.js" type="module"></script>
</body>
</html>
